<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Dossiary sends a scan request to the scan helper on the same computer; the helper forwards it over HTTPS to scanix500-server on a Raspberry Pi, which drives the iX500 over USB and returns the PDF, then makes it searchable in the background. Below, a timeline of a 6-page scan: the PDF arrives after 27 seconds and is searchable after about 179; recognising text first would take 332 seconds.">
<style>
  .bg{fill:#f6f7f4} .surface{fill:#ffffff} .ink{fill:#1d2421} .muted{fill:#5d6a64} .acc{fill:#157a55} .soft{fill:#d5ebe0}
  .s-ink{stroke:#1d2421} .s-line{stroke:#c9d1cc} .s-muted{stroke:#5d6a64} .s-acc{stroke:#157a55}
  text{font-family:"Helvetica Neue",Arial,sans-serif} .mono{font-family:Menlo,Consolas,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#131917} .surface{fill:#1b2320} .ink{fill:#e3ebe6} .muted{fill:#98a7a0} .acc{fill:#4fe0a6} .soft{fill:#1f3a30}
    .s-ink{stroke:#e3ebe6} .s-line{stroke:#34413c} .s-muted{stroke:#98a7a0} .s-acc{stroke:#4fe0a6}
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ink"/></marker>
  <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
</defs>
<rect width="960" height="560" rx="10" class="bg"/>
<text x="20" y="36" font-size="20" font-weight="700" class="ink">How a scan travels from an iX500 on a Raspberry Pi to Dossiary</text>
<g transform="translate(0,50)">
  <rect x="10" y="20" width="440" height="200" rx="10" fill="none" stroke-dasharray="5 5" class="s-line"/>
  <text x="22" y="40" font-size="12" class="muted mono">YOUR COMPUTER</text>
  <rect x="520" y="20" width="430" height="200" rx="10" fill="none" stroke-dasharray="5 5" class="s-line"/>
  <text x="532" y="40" font-size="12" class="muted mono">RASPBERRY PI</text>
  <rect x="30" y="80" width="160" height="80" rx="8" class="surface s-ink"/>
  <text x="110" y="113" text-anchor="middle" font-size="15" font-weight="700" class="ink">Dossiary</text>
  <text x="110" y="135" text-anchor="middle" font-size="12" class="muted">in Chrome</text>
  <rect x="260" y="80" width="170" height="80" rx="8" class="surface s-ink"/>
  <text x="345" y="110" text-anchor="middle" font-size="15" font-weight="700" class="ink">Scan Helper</text>
  <text x="345" y="130" text-anchor="middle" font-size="12" class="muted">relay to the Pi</text>
  <text x="345" y="148" text-anchor="middle" font-size="11" class="muted mono">0.3.0 or later</text>
  <rect x="540" y="80" width="220" height="80" rx="8" stroke-width="1.5" class="soft s-acc"/>
  <text x="650" y="108" text-anchor="middle" font-size="15" font-weight="700" class="ink">scanix500-server</text>
  <text x="650" y="128" text-anchor="middle" font-size="12" class="muted">capture · blank pages · PDF</text>
  <text x="650" y="146" text-anchor="middle" font-size="12" class="muted">OCR job queue</text>
  <rect x="830" y="80" width="100" height="80" rx="8" class="surface s-ink"/>
  <text x="880" y="113" text-anchor="middle" font-size="15" font-weight="700" class="ink">iX500</text>
  <text x="880" y="135" text-anchor="middle" font-size="12" class="muted">ScanSnap</text>
  <line x1="192" y1="105" x2="256" y2="105" stroke-width="1.5" class="s-ink" marker-end="url(#arr)"/>
  <text x="224" y="97" text-anchor="middle" font-size="10" class="ink mono">POST /scan</text>
  <line x1="256" y1="140" x2="192" y2="140" stroke-width="1.5" class="s-ink" marker-end="url(#arr)"/>
  <text x="224" y="157" text-anchor="middle" font-size="11" class="ink mono">PDF</text>
  <text x="224" y="185" text-anchor="middle" font-size="11" class="muted">localhost only</text>
  <line x1="432" y1="105" x2="536" y2="105" stroke-width="2.5" class="s-acc" marker-end="url(#arra)"/>
  <text x="484" y="97" text-anchor="middle" font-size="10" class="acc mono">HTTPS :8767</text>
  <line x1="536" y1="140" x2="432" y2="140" stroke-width="2.5" class="s-acc" marker-end="url(#arra)"/>
  <text x="484" y="157" text-anchor="middle" font-size="10" class="acc mono">PDF, token</text>
  <text x="484" y="185" text-anchor="middle" font-size="11" class="muted">pinned certificate</text>
  <line x1="762" y1="120" x2="826" y2="120" stroke-width="1.5" class="s-ink" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="794" y="112" text-anchor="middle" font-size="10" class="ink mono">USB · SANE</text>
  <path d="M 345 162 C 345 262, 650 262, 650 162" fill="none" stroke-width="1.2" stroke-dasharray="4 4" class="s-ink" marker-end="url(#arr)"/>
  <text x="497" y="276" text-anchor="middle" font-size="11" class="ink mono">GET /ocr/&lt;job&gt; until the searchable PDF is ready</text>
</g>
<g transform="translate(0,350)">
  <text x="20" y="10" font-size="14" font-weight="700" class="ink">One 6-page duplex scan, to scale</text>
  <g font-size="11" text-anchor="middle" class="muted mono">
    <line x1="230" y1="150" x2="944" y2="150" class="s-line"/>
    <line x1="230" y1="146" x2="230" y2="154" class="s-muted"/><text x="230" y="170">0 s</text>
    <line x1="356" y1="146" x2="356" y2="154" class="s-muted"/><text x="356" y="170">60</text>
    <line x1="482" y1="146" x2="482" y2="154" class="s-muted"/><text x="482" y="170">120</text>
    <line x1="608" y1="146" x2="608" y2="154" class="s-muted"/><text x="608" y="170">180</text>
    <line x1="734" y1="146" x2="734" y2="154" class="s-muted"/><text x="734" y="170">240</text>
    <line x1="860" y1="146" x2="860" y2="154" class="s-muted"/><text x="860" y="170">300</text>
  </g>
  <text x="20" y="52" font-size="13" font-weight="700" class="ink">Background OCR</text>
  <text x="20" y="68" font-size="11" class="muted">how Dossiary scans</text>
  <rect x="230" y="40" width="56.7" height="26" rx="3" class="acc"/>
  <rect x="286.7" y="40" width="319.2" height="26" rx="3" stroke-dasharray="3 3" class="soft s-acc"/>
  <text x="258" y="34" text-anchor="middle" font-size="11" class="acc mono">PDF in Inbox · 27 s</text>
  <text x="446" y="57" text-anchor="middle" font-size="11" class="ink">you keep working · OCR on the Pi</text>
  <text x="612" y="57" font-size="11" class="ink mono">searchable · ~179 s</text>
  <text x="20" y="114" font-size="13" font-weight="700" class="ink">OCR first</text>
  <text x="20" y="130" font-size="11" class="muted">for comparison</text>
  <rect x="230" y="102" width="697.2" height="26" rx="3" opacity="0.35" class="muted"/>
  <text x="578" y="119" text-anchor="middle" font-size="11" class="ink">waiting: scan, then text recognition, then the answer</text>
  <text x="930" y="96" text-anchor="end" font-size="11" class="ink mono">332 s</text>
</g>
</svg>
