[project]
name = "scanix500"
version = "0.2.1"
description = "Vendor-independent scan pipeline for the ScanSnap iX500"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
menubar = ["rumps>=0.4"]

[project.scripts]
scanix500 = "scanix500.cli:main"
scanix500-menubar = "scanix500.menubar.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
filterwarnings = ["error::objc.ObjCSuperWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/scanix500"]
