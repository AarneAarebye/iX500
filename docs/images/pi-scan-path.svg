<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Dossiary sends the scan request to the scan helper on the same computer; the helper forwards it over HTTPS to scanix500-server on the Pi, which drives the iX500 over USB and returns the PDF, then finishes text recognition in the background.">
  <rect x="0" y="0" width="960" height="300" rx="12" fill="#ffffff"/>
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#1d2421"/>
            </marker>
            <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" style="fill:#157a55"/>
            </marker>
          </defs>

          <!-- computer boundary -->
          <rect x="10" y="20" width="440" height="200" rx="10" fill="none" stroke-dasharray="5 5" style="stroke:#c9d1cc"/>
          <text x="22" y="40" font-size="12" style="fill:#5d6a64;font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">YOUR MAC (later also Windows)</text>
          <!-- pi boundary -->
          <rect x="520" y="20" width="430" height="200" rx="10" fill="none" stroke-dasharray="5 5" style="stroke:#c9d1cc"/>
          <text x="532" y="40" font-size="12" style="fill:#5d6a64;font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">RASPBERRY PI · scanner</text>

          <!-- Dossiary -->
          <rect x="30" y="80" width="160" height="80" rx="8" stroke="#1d2421" style="fill:#ffffff"/>
          <text x="110" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2421" style="font-family:Archivo, 'Helvetica Neue', Arial, sans-serif">Dossiary</text>
          <text x="110" y="135" text-anchor="middle" font-size="12" style="fill:#5d6a64">in Chrome</text>

          <!-- Helper -->
          <rect x="260" y="80" width="170" height="80" rx="8" style="fill:#ffffff;stroke:#1d2421"/>
          <text x="345" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2421" style="font-family:Archivo, 'Helvetica Neue', Arial, sans-serif">Scan Helper</text>
          <text x="345" y="130" text-anchor="middle" font-size="12" style="fill:#5d6a64">relay to the Pi</text>
          <text x="345" y="148" text-anchor="middle" font-size="11" style="fill:#5d6a64;font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">0.3.0 or later</text>

          <!-- server -->
          <rect x="540" y="80" width="220" height="80" rx="8" stroke-width="1.5" style="fill:#d5ebe0;stroke:#157a55"/>
          <text x="650" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2421" style="font-family:Archivo, 'Helvetica Neue', Arial, sans-serif">scanix500-server</text>
          <text x="650" y="128" text-anchor="middle" font-size="12" style="fill:#5d6a64">capture · blank pages · PDF</text>
          <text x="650" y="146" text-anchor="middle" font-size="12" style="fill:#5d6a64">OCR job queue</text>

          <!-- scanner -->
          <rect x="830" y="80" width="100" height="80" rx="8" stroke="#1d2421" style="fill:#ffffff"/>
          <text x="880" y="113" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2421" style="font-family:Archivo, 'Helvetica Neue', Arial, sans-serif">iX500</text>
          <text x="880" y="135" text-anchor="middle" font-size="12" style="fill:#5d6a64">ScanSnap</text>

          <!-- Dossiary -> helper -->
          <line x1="192" y1="105" x2="256" y2="105" stroke="#1d2421" stroke-width="1.5" marker-end="url(#arr)"/>
          <text x="224" y="97" text-anchor="middle" font-size="11" fill="#1d2421" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">POST /scan</text>
          <line x1="256" y1="140" x2="192" y2="140" stroke="#1d2421" stroke-width="1.5" marker-end="url(#arr)"/>
          <text x="224" y="157" text-anchor="middle" font-size="11" fill="#1d2421" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">PDF</text>
          <text x="224" y="185" text-anchor="middle" font-size="11" style="fill:#5d6a64">localhost only</text>

          <!-- helper -> server (the network hop) -->
          <line x1="432" y1="105" x2="536" y2="105" stroke-width="2.5" marker-end="url(#arr-accent)" style="stroke:#157a55"/>
          <text x="484" y="97" text-anchor="middle" font-size="11" style="fill:#157a55;font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">HTTPS :8767</text>
          <line x1="536" y1="140" x2="432" y2="140" stroke-width="2.5" marker-end="url(#arr-accent)" style="stroke:#157a55"/>
          <text x="484" y="157" text-anchor="middle" font-size="11" style="fill:#157a55;font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">PDF, token</text>
          <text x="484" y="185" text-anchor="middle" font-size="11" style="fill:#5d6a64">pinned certificate</text>

          <!-- server -> scanner -->
          <line x1="762" y1="120" x2="826" y2="120" stroke="#1d2421" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
          <text x="794" y="112" text-anchor="middle" font-size="11" fill="#1d2421" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">USB · SANE</text>

          <!-- background OCR loop -->
          <path d="M 345 162 C 345 262, 650 262, 650 162" fill="none" stroke="#1d2421" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
          <text x="497" y="276" text-anchor="middle" font-size="11" fill="#1d2421" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace">GET /ocr/&lt;job&gt; until the searchable PDF is ready</text>
        </svg>
